# ---------------------------------------------------------------------------
# One domain, many applications, each under its own path prefix.
#
# Two things here are not obvious and both cost me real debugging time:
#
# 1. proxy_pass with a VARIABLE upstream ($alpha_upstream) forces nginx to
#    resolve the name at request time instead of at startup. Without it, a
#    single unavailable container makes nginx refuse to start - taking every
#    other app on the box down with it.
#
# 2. Docker's embedded DNS server must be named explicitly as the resolver,
#    otherwise variable upstreams cannot be resolved at all.
# ---------------------------------------------------------------------------

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # Security headers applied to every app behind this proxy.
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    # Enable once TLS terminates here:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;

    location = / {
        return 200 "multi-app-edge: try /alpha/ or /beta/\n";
        add_header Content-Type text/plain;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------------------
    # alpha - Django, served under /alpha/
    #
    # The prefix is NOT stripped: Django is told it lives at /alpha via
    # SCRIPT_NAME, so it generates correct URLs itself. Stripping the prefix
    # here and letting the app think it is at / is the usual cause of
    # redirects that dump the user back on the domain root.
    # -----------------------------------------------------------------------
    location /alpha/ {
        set $alpha_upstream http://alpha:8000;
        proxy_pass $alpha_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Script-Name     /alpha;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # -----------------------------------------------------------------------
    # beta - static SPA, served under /beta/
    #
    # The container serves the app at its own root, so the prefix IS stripped
    # here with an explicit rewrite. Getting this wrong returns index.html for
    # .css and .js requests, which the browser reports as a MIME-type error -
    # a misleading symptom that has nothing to do with MIME types.
    # -----------------------------------------------------------------------
    location /beta/ {
        set $beta_upstream http://beta:80;
        rewrite ^/beta/(.*)$ /$1 break;
        proxy_pass $beta_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }
}
