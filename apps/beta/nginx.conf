server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback: unknown paths return index.html so client-side routing
    # works. Asset requests must NOT hit this fallback - returning HTML for a
    # .js request is what the browser reports as a MIME-type error.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|woff2)$ {
        try_files $uri =404;
        expires 1h;
    }
}
